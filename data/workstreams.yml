  - id: design-systems
    name: Design systems and component practice
    description: Design-system evaluation, component accessibility, and user preferences.
    repositories:
      - mgifford/design-system-lab
      - mgifford/design-system
      - mgifford/design-system-scan
      - mgifford/opendesign.guide
